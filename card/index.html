<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0F14">
<title>CrewJournal – 3 months free</title>
<meta property="og:title" content="CrewJournal – 3 months free">
<meta property="og:image" content="https://crewjournal.com/assets/og.png">
<!-- Business-card QR code (crewjournal.com/card). Not linked anywhere on the website.
     Same page for all three crew apps (CrewLoops, CrewJournal, CrewDreams): first this "3 months free" screen, then the store.
     OFFER: App Store offer code link (CREWCARD); empty = no code, the button opens the App Store page.
     To change or end the offer, only change OFFER here; the printed cards keep working. -->
<style>
@font-face{font-family:Disp;font-weight:600;src:url(/assets/bc-600.woff2) format('woff2')}@font-face{font-family:Disp;font-weight:700;src:url(/assets/bc-700.woff2) format('woff2')}
:root{--bg:#0C0F14;--ink:#F1ECE2;--muted:#B9B2A4;--accent:#F2B13C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom));text-align:center;
  background:radial-gradient(60% 45% at 50% 30%, rgba(107,76,18,.6), transparent)}
.icon{width:112px;height:112px;border-radius:25px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.eyebrow{margin:28px 0 6px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:Disp,system-ui,sans-serif;font-size:52px;line-height:1.05;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.lead{margin:14px auto 0;max-width:340px;font-size:17px;line-height:1.45;color:var(--muted)}
ul{list-style:none;padding:0;margin:26px auto 0;max-width:340px;text-align:left;display:grid;gap:12px}
li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.4}
li b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:13px;display:grid;place-items:center;margin-top:1px}
.btn{display:block;width:100%;max-width:340px;margin:32px auto 0;padding:17px 20px;border-radius:16px;background:var(--accent);color:#1A1406;font-size:17px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <img class="icon" src="/assets/icon-512.png" alt="CrewJournal">
  <p class="eyebrow" id="eyebrow">Welcome to CrewJournal</p>
  <h1 id="title">3 months free</h1>
  <p class="lead" id="lead"></p>
  <ul id="list"></ul>
  <a class="btn" id="go" href="https://crewjournal.com/"></a>
</main>
<script>
(function () {
  var OFFER = "https://apps.apple.com/redeem?ctx=offercodes&id=6827171140&code=CREWCARD";
  var APP_STORE = "https://apps.apple.com/app/id6827171140";
  var PLAY_STORE = "";    // once live on Google Play
  var SITE = 'https://crewjournal.com/';
  var TEXT = {"en": {"lead": "CrewJournal Pro is yours for 3 months: as many trips as you like.", "b": ["Your logbook from a screenshot", "Every flight, every crew", "Encrypted, readable only by you"], "cta": "Activate 3 months free", "note": "Apple then shows the offer, just confirm it. For new subscribers. After 3 months the subscription continues unless you cancel, anytime in your Apple ID settings."}, "de": {"lead": "CrewJournal Pro gehört 3 Monate dir: so viele Rotationen, wie du willst.", "b": ["Dein Logbuch aus einem Screenshot", "Jeder Flug, jede Crew", "Verschlüsselt, lesbar nur für dich"], "cta": "3 Monate gratis aktivieren", "note": "Apple zeigt dann das Angebot, einfach bestätigen. Für neue Abonnent:innen. Nach 3 Monaten läuft das Abo weiter, außer du kündigst – jederzeit in den Einstellungen deiner Apple-ID."}};
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var de = /^de\b/i.test(navigator.language || '');
  var t = TEXT[de ? 'de' : 'en'];
  if (de) { document.documentElement.lang = 'de'; document.title = 'CrewJournal – 3 Monate gratis';
    document.getElementById('eyebrow').textContent = 'Willkommen bei CrewJournal'; document.getElementById('title').textContent = '3 Monate gratis'; }
  document.getElementById('lead').textContent = t.lead;
  document.getElementById('list').innerHTML = t.b.map(function (x) { return '<li><b>✓</b><span></span></li>'; }).join('');
  [].forEach.call(document.querySelectorAll('#list span'), function (s, i) { s.textContent = t.b[i]; });
  var go = document.getElementById('go');
  go.textContent = t.cta;
  if (android) {
    go.href = PLAY_STORE || SITE;
    if (!PLAY_STORE) { go.textContent = de ? 'Zur Website' : 'Visit the website'; }
  } else {
    go.href = OFFER || APP_STORE;
  }
})();
</script>
</body>
</html>
